  function wc(text) {

  function esc(s) {
    if (s === null || s === undefined) return "";
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function detectIndustry(text) {
    if (!text || text.trim().length < 30) return null;
    var lower = text.toLowerCase();

    function hasWord(kw) {
      var escaped = kw.replace(/[.*+?^${}()|[\]\\]/g, function (m) { return "\\" + m; });
      var pattern = "(^|[^a-z0-9])" + escaped + "(?![a-z0-9])";
      try {
        return new RegExp(pattern, "i").test(lower);
      } catch (e) {
        return false;
      }
    }

    var scores = {};
    var ids = Object.keys(INDUSTRY_SIGNATURES);
    for (var i = 0; i < ids.length; i++) {
      var id = ids[i];
      var sig = INDUSTRY_SIGNATURES[id];
      var s = 0;
      for (var j = 0; j < sig.strong.length; j++) {
        if (hasWord(sig.strong[j])) s += 3;
      }
      for (var k = 0; k < sig.weak.length; k++) {
        if (hasWord(sig.weak[k])) s += 1;
      }
      scores[id] = s;
    }

    var sorted = Object.keys(scores).map(function (key) { return [key, scores[key]]; }).sort(function (a, b) { return b[1] - a[1]; });
    var topId = sorted[0][0];
    var topScore = sorted[0][1];
    var secondScore = sorted[1] ? sorted[1][1] : 0;
    if (topScore >= 3 && topScore - secondScore >= 2) return topId;
    return "general";
  }

  // Post-process AI output to strip em-dashes / en-dashes that slip through.
  function scrubAiTells(text) {
    if (!text || typeof text !== "string") return text;
    var out = text;
    out = out.replace(/\s*—\s*/g, ". ");
    out = out.replace(/\s*–\s*/g, ". ");
    out = out.replace(/\s*;\s*/g, ". ");
    out = out.replace(/\.\s*\.\s*/g, ". ");
    out = out.replace(/\. ([a-z])/g, function (m, c) { return ", " + c; });
    return out;
  }

    return {

  function copyBtnHtml(copyId, small) {
    return '<button class="copy-btn" data-copy="' + copyId + '" style="' +

      'padding:' + (small ? '5px 10px' : '6px 14px') + ';' +

  var copyTargets = {}; // copyId -> text

  function doCopy(btn) {
    var id = btn.getAttribute("data-copy");
    var text = copyTargets[id] || "";
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text);
    } else {
      var ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
    }
    btn.textContent = "✓ Copied";
    btn.style.background = "linear-gradient(180deg,#E8FFF1,#D4F7E0)";
    btn.style.color = "#15803d";
    btn.style.borderColor = "#86efac";
    setTimeout(function () {
      btn.textContent = "Copy";
      btn.style.background = "rgba(255,255,255,0.65)";
      btn.style.color = "#0057B8";
      btn.style.borderColor = "rgba(255,255,255,0.9)";
    }, 1800);
  }

        copyBtnHtml(fullId, false) +
      '</div>' +
      '<div style="margin:14px 18px 0;background:linear-gradient(180deg, rgba(234,244,255,0.85), rgba(220,233,255,0.65));border:0.5px solid rgba(10,132,255,0.18);border-radius:12px;padding:12px 14px;">' +
        '<div style="font-size:10px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#006FE6;margin-bottom:5px;opacity:0.75;">Subject</div>' +
        '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">' +
          '<div style="font-size:13.5px;font-weight:600;color:#0F1217;">' + esc(v.subject) + '</div>' +
          copyBtnHtml(subjId, true) +
        '</div>' +
      '</div>' +
      '<div style="padding:14px 18px 18px;font-size:14px;line-height:1.65;color:#2A2F39;white-space:pre-wrap;word-break:break-word;">' + esc(v.body) + '</div>' +
    '</div>';
  }

  function tmaySectionHtml(tmay) {
    var beats = [
      { key: "hook", label: "Hook", sub: "5-10 seconds", color: "#DC2626", tint: "rgba(255,240,240,0.55)", border: "rgba(220,80,80,0.2)" },
      { key: "credibility", label: "Credibility", sub: "10-15 seconds", color: "#006FE6", tint: "rgba(234,244,255,0.65)", border: "rgba(10,132,255,0.18)" },
      { key: "solution", label: "Solution", sub: "15-20 seconds", color: "#0D9488", tint: "rgba(232,255,248,0.6)", border: "rgba(13,148,136,0.2)" },
      { key: "proof", label: "Proof", sub: "10-15 seconds", color: "#7C3AED", tint: "rgba(248,240,255,0.6)", border: "rgba(124,58,237,0.18)" },
      { key: "close", label: "Close", sub: "5-10 seconds", color: "#B45309", tint: "rgba(255,248,235,0.7)", border: "rgba(217,119,6,0.2)" }
    ];

    var fullScript = beats.map(function (b) { return tmay[b.key] ? tmay[b.key] : ""; }).filter(Boolean).join("\n\n");
    copyTargets["tmay-full"] = fullScript;

    var beatsHtml = beats.map(function (b) {
      var text = tmay[b.key];
      if (!text) return "";
      return '<div style="display:flex;gap:12px;margin-bottom:14px;align-items:flex-start;">' +
        '<div style="flex-shrink:0;width:90px;padding-top:2px;">' +
          '<div style="font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:' + b.color + ';line-height:1.3;">' + b.label + '</div>' +
          '<div style="font-size:10px;color:#8E96A3;font-family:monospace;margin-top:2px;">' + b.sub + '</div>' +
        '</div>' +
        '<div style="flex:1;min-width:0;">' +
          '<div style="padding:12px 14px;background:' + b.tint + ';border:0.5px solid ' + b.border + ';border-left:3px solid ' + b.color + ';border-radius:11px;font-size:13.5px;line-height:1.6;color:#2A2F39;letter-spacing:-0.005em;">' + esc(text) + '</div>' +
        '</div>' +
      '</div>';
    }).join("");

    var tips = Array.isArray(tmay.deliveryTips) ? tmay.deliveryTips : [];
    var tipsHtml = "";
    if (tips.length > 0) {
      tipsHtml = '<div style="padding:16px 20px 20px;border-top:0.5px solid rgba(15,18,23,0.06);background:rgba(247,250,255,0.5);">' +
        '<div style="font-size:10.5px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#006FE6;margin-bottom:10px;">Delivery Tips</div>' +
        '<div style="display:flex;flex-direction:column;gap:8px;">' +
          tips.map(function (t, i) {
            return '<div style="display:flex;gap:10px;align-items:flex-start;padding:9px 12px;background:rgba(255,255,255,0.7);border:0.5px solid rgba(15,18,23,0.06);border-radius:10px;">' +
              '<div style="width:18px;height:18px;border-radius:6px;flex-shrink:0;display:grid;place-items:center;margin-top:1px;background:rgba(10,132,255,0.1);color:#006FE6;font-size:10.5px;font-weight:700;">' + (i + 1) + '</div>' +
              '<div style="font-size:12.5px;color:#2A2F39;line-height:1.5;letter-spacing:-0.005em;">' + esc(t) + '</div>' +
            '</div>';
          }).join("") +
        '</div>' +
      '</div>';
    }

    return '<div id="tmay-section" style="background:rgba(255,255,255,0.55);border:0.5px solid rgba(255,255,255,0.9);border-radius:22px;box-shadow:0 8px 24px -8px rgba(15,30,60,0.10), 0 24px 64px -28px rgba(10,132,255,0.20);overflow:hidden;margin-top:20px;scroll-margin-top:80px;">' +
      '<div style="padding:18px 20px 14px;border-bottom:0.5px solid rgba(15,18,23,0.08);background:linear-gradient(180deg, rgba(234,244,255,0.55), rgba(255,255,255,0.35));display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;">' +
        '<div style="min-width:0;flex:1;">' +
          '<div style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:white;background:linear-gradient(180deg, #5AAEFF 0%, #3D8BFF 35%, #006FE6 100%);box-shadow:0 4px 10px -4px rgba(10,132,255,0.55);margin-bottom:8px;">' +
            '<span style="width:5px;height:5px;border-radius:50%;background:white;"></span>Video Introduction Script</div>' +
          '<div style="font-size:16px;font-weight:700;color:#0F1217;letter-spacing:-0.015em;">Tell me about yourself, tailored</div>' +
          '<div style="font-size:12.5px;color:#5F6773;margin-top:3px;letter-spacing:-0.005em;">Read it, record it, or say it live. Structured for ' + esc(tmay.totalDuration || "60 to 90 seconds") + ' of natural delivery.</div>' +
        '</div>' +
        copyBtnHtml("tmay-full", false) +
      '</div>' +
      '<div style="padding:20px 20px 8px;">' + beatsHtml + '</div>' +
      tipsHtml +
    '</div>';
  }

  function prepSectionHtml(prep) {
    var painPoints = Array.isArray(prep.painPoints) ? prep.painPoints : [];
    var likelyQuestions = Array.isArray(prep.likelyQuestions) ? prep.likelyQuestions : [];
    var research = Array.isArray(prep.researchBeforeCall) ? prep.researchBeforeCall : [];
    var redFlags = Array.isArray(prep.redFlags) ? prep.redFlags : [];

    function subHeader(label, count) {
      return '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">' +
        '<div style="font-size:10.5px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#006FE6;">' + label + '</div>' +
        '<div style="font-size:10px;font-weight:600;color:#5F6773;background:rgba(15,18,23,0.05);border-radius:99px;padding:1px 8px;">' + count + '</div>' +
      '</div>';
    }

    var blockCss = "padding:18px 20px;border-top:0.5px solid rgba(15,18,23,0.06);";
    var html = "";

    if (painPoints.length > 0) {
      html += '<div style="' + blockCss + '">' + subHeader("Pain Points from the JD", painPoints.length) +
        '<div style="display:flex;flex-direction:column;gap:12px;">' +
          painPoints.map(function (p) {
            return '<div style="padding:12px 14px;background:rgba(255,240,240,0.5);border:0.5px solid rgba(220,80,80,0.15);border-radius:11px;border-left:3px solid rgba(220,80,80,0.5);">' +
              '<div style="font-size:13px;font-weight:600;color:#0F1217;line-height:1.4;letter-spacing:-0.005em;">' + esc(p.pain) + '</div>' +
              (p.why ? '<div style="font-size:12px;color:#5F6773;margin-top:5px;line-height:1.5;">' + esc(p.why) + '</div>' : '') +
            '</div>';
          }).join("") +
        '</div></div>';
    }

    if (likelyQuestions.length > 0) {
      html += '<div style="' + blockCss + '">' + subHeader("Likely Questions and How to Answer", likelyQuestions.length) +
        '<div style="display:flex;flex-direction:column;gap:12px;">' +
          likelyQuestions.map(function (q) {
            return '<div style="padding:12px 14px;background:rgba(240,246,255,0.6);border:0.5px solid rgba(10,132,255,0.15);border-radius:11px;">' +
              '<div style="display:flex;gap:8px;align-items:flex-start;">' +
                '<div style="min-width:22px;height:22px;border-radius:7px;flex-shrink:0;background:linear-gradient(180deg, #5AAEFF, #006FE6);color:white;font-size:11px;font-weight:700;display:grid;place-items:center;box-shadow:0 2px 6px -2px rgba(10,132,255,0.5);">Q</div>' +
                '<div style="font-size:13px;font-weight:600;color:#0F1217;line-height:1.4;letter-spacing:-0.005em;">' + esc(q.question) + '</div>' +
              '</div>' +
              (q.how ? '<div style="margin-top:8px;padding-left:30px;font-size:12px;color:#2A2F39;line-height:1.55;"><span style="font-weight:700;color:#006FE6;font-size:10.5px;letter-spacing:0.08em;text-transform:uppercase;margin-right:6px;">How</span>' + esc(q.how) + '</div>' : '') +
            '</div>';
          }).join("") +
        '</div></div>';
    }

    if (research.length > 0) {
      html += '<div style="' + blockCss + '">' + subHeader("Research Before the Call", research.length) +
        '<div style="display:flex;flex-direction:column;gap:8px;">' +
          research.map(function (r, i) {
            return '<div style="display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:rgba(255,255,255,0.6);border:0.5px solid rgba(15,18,23,0.08);border-radius:10px;">' +
              '<div style="width:18px;height:18px;border-radius:6px;flex-shrink:0;display:grid;place-items:center;margin-top:1px;background:rgba(10,132,255,0.1);color:#006FE6;font-size:11px;font-weight:700;">' + (i + 1) + '</div>' +
              '<div style="font-size:12.5px;color:#2A2F39;line-height:1.5;letter-spacing:-0.005em;">' + esc(r) + '</div>' +
            '</div>';
          }).join("") +
        '</div></div>';
    }

    if (redFlags.length > 0) {
      html += '<div style="' + blockCss + '">' + subHeader("Red Flags to Watch For", redFlags.length) +
        '<div style="display:flex;flex-direction:column;gap:8px;">' +
          redFlags.map(function (r) {
            return '<div style="display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:rgba(255,248,235,0.7);border:0.5px solid rgba(217,119,6,0.2);border-radius:10px;">' +
              '<div style="width:18px;height:18px;border-radius:6px;flex-shrink:0;display:grid;place-items:center;margin-top:1px;background:rgba(217,119,6,0.15);color:#B45309;font-size:11px;font-weight:700;">!</div>' +
              '<div style="font-size:12.5px;color:#78350F;line-height:1.5;letter-spacing:-0.005em;">' + esc(r) + '</div>' +
            '</div>';
          }).join("") +
        '</div></div>';
    }

    return '<div id="prep-section" style="background:rgba(255,255,255,0.55);border:0.5px solid rgba(255,255,255,0.9);border-radius:22px;box-shadow:0 8px 24px -8px rgba(15,30,60,0.10), 0 24px 64px -28px rgba(10,132,255,0.20);overflow:hidden;margin-top:20px;scroll-margin-top:80px;">' +
      '<div style="padding:18px 20px 14px;border-bottom:0.5px solid rgba(15,18,23,0.08);background:linear-gradient(180deg, rgba(234,244,255,0.55), rgba(255,255,255,0.35));">' +
        '<div style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:white;background:linear-gradient(180deg, #5AAEFF 0%, #3D8BFF 35%, #006FE6 100%);box-shadow:0 4px 10px -4px rgba(10,132,255,0.55);margin-bottom:8px;">' +
          '<span style="width:5px;height:5px;border-radius:50%;background:white;"></span>Interview Prep Guide</div>' +
        '<div style="font-size:16px;font-weight:700;color:#0F1217;letter-spacing:-0.015em;">Get ready for the call</div>' +
        '<div style="font-size:12.5px;color:#5F6773;margin-top:3px;letter-spacing:-0.005em;">If they respond, here is what to prepare. Read this before you get on the call.</div>' +
      '</div>' + html +
    '</div>';
  }

  function stickyNavHtml() {
    var hasVar = !!state.variations, hasTmay = !!state.tmay, hasPrep = !!state.prep;
    if (!hasVar && !hasTmay && !hasPrep) return "";

    function btn(id, label, badge) {
      return '<button class="nav-btn" data-target="' + id + '" style="display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;font-size:12px;font-weight:600;color:#0F1217;background:rgba(255,255,255,0.7);border:0.5px solid rgba(255,255,255,0.9);box-shadow:inset 0 0.5px 0 rgba(255,255,255,0.95), 0 1px 2px rgba(15,30,60,0.06);cursor:pointer;font-family:inherit;letter-spacing:-0.005em;">' +
        (badge ? '<span style="width:18px;height:18px;border-radius:5px;flex-shrink:0;background:linear-gradient(180deg, #5AAEFF, #006FE6);color:white;font-size:10px;font-weight:700;display:grid;place-items:center;box-shadow:0 2px 4px -1px rgba(10,132,255,0.5);">' + badge + '</span>' : '') +
        label + '</button>';
    }

    var inner = "";
    if (hasVar) inner += btn("letter-a", "Direct", "A") + btn("letter-b", "Story", "B") + btn("letter-c", "Curious", "C");
    if (hasTmay) inner += btn("tmay-section", "TMAY Script", null);
    if (hasPrep) inner += btn("prep-section", "Prep Guide", null);
    inner += btn("top-of-form", "Top", null);

    return '<div style="position:sticky;top:12px;z-index:50;display:flex;justify-content:center;margin-bottom:16px;pointer-events:none;">' +
      '<div style="display:inline-flex;flex-wrap:wrap;gap:6px;padding:6px;background:rgba(255,255,255,0.75);border:0.5px solid rgba(255,255,255,0.9);border-radius:99px;backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);box-shadow:inset 0 0.5px 0 rgba(255,255,255,0.95), 0 4px 14px -4px rgba(15,30,60,0.12), 0 20px 40px -20px rgba(10,132,255,0.35);pointer-events:auto;max-width:100%;">' +
      inner + '</div></div>';
  }

  function renderResults() {
    copyTargets = {};
    var html = "";

    if ((state.variations || state.tmay || state.prep) && !state.loading) {
      html += stickyNavHtml();
    }

    if (state.error && !state.loading) {
      html += '<div style="background:#fff5f5;border:1px solid #fec5c5;border-radius:12px;padding:16px;color:#c0392b;font-size:13px;text-align:center;margin-bottom:16px;">' +
        '<div style="margin-bottom:8px;">' + esc(state.error) + '</div>' +
        '<button id="retry-btn" style="padding:8px 20px;font-size:13px;border-radius:10px;background:linear-gradient(180deg, #5AAEFF, #006FE6);color:white;border:0;font-weight:600;cursor:pointer;font-family:inherit;">Retry</button>' +
      '</div>';
    }

    if (state.loading) {
      html += '<div style="display:flex;flex-direction:column;gap:14px;">' + skeletonCardHtml() + skeletonCardHtml() + skeletonCardHtml() + '</div>';
    }

    if (state.variations && !state.loading) {
      html += '<div style="display:flex;flex-direction:column;gap:14px;">' +
        state.variations.map(function (v, idx) { return variationCardHtml(v, idx); }).join("") +
      '</div>';
    }

    if (state.tmay && !state.loading) html += tmaySectionHtml(state.tmay);
    if (state.prep && !state.loading) html += prepSectionHtml(state.prep);

    resultsEl.innerHTML = html;

    var retry = document.getElementById("retry-btn");
    if (retry) retry.addEventListener("click", generate);
  }

  /* ============================ EVENTS ============================ */

  jdInput.addEventListener("input", function (e) {
    state.jd = e.target.value;
    var detected = detectIndustry(state.jd);
    if (detected) state.industry = detected;
    renderJdMeta();
    renderIndustryBlock();
    renderExperience();
    renderGenerateBtn();
  });

  notesInput.addEventListener("input", function (e) { state.notes = e.target.value; });
  nameInput.addEventListener("input", function (e) { state.name = e.target.value; });
  whatsappInput.addEventListener("input", function (e) { state.whatsapp = e.target.value; });
  toneInput.addEventListener("input", function (e) { state.tone = +e.target.value; });
  lengthInput.addEventListener("input", function (e) { state.length = +e.target.value; });

  document.getElementById("load-sample").addEventListener("click", function () {
    var ind = currentIndustry();
    state.jd = ind.sample;
    jdInput.value = ind.sample;
    var detected = detectIndustry(ind.sample);
    if (detected) state.industry = detected;
    renderJdMeta();
    renderIndustryBlock();
    renderExperience();
    renderGenerateBtn();
  });

  generateBtn.addEventListener("click", generate);

  // Delegated clicks for copy buttons and sticky-nav scroll
  document.addEventListener("click", function (e) {
    var copyBtn = e.target.closest ? e.target.closest(".copy-btn") : null;
    if (copyBtn) { doCopy(copyBtn); return; }
    var navBtn = e.target.closest ? e.target.closest(".nav-btn") : null;
    if (navBtn) {
      var el = document.getElementById(navBtn.getAttribute("data-target"));
      if (el) {
        var y = el.getBoundingClientRect().top + window.pageYOffset - 80;
        window.scrollTo({ top: y, behavior: "smooth" });
      }
    }
  });

  /* ============================ GENERATE ============================ */

  async function generate() {
    if (state.jd.trim().length < 20) return;
    state.loading = true;
    state.error = "";
    state.variations = null;
    state.tmay = null;
    state.prep = null;
    renderGenerateBtn();
    renderResults();

    try {
      var prompt = buildPromptText({
        ind: currentIndustry(), plat: currentPlatform(), tone: state.tone, length: state.length,
        experience: state.experience, notes: state.notes, name: state.name,
        whatsapp: state.whatsapp, jd: state.jd, platform: state.platform
      });

      // ---- Built-in web-app API call ----
      if (!window.claude || typeof window.claude.complete !== "function") {
        throw new Error("The completion API (window.claude.complete) is not available in this environment.");
      }
      var raw = await window.claude.complete(prompt);
      // -----------------------------------

      var first = raw.indexOf("{");
      var last = raw.lastIndexOf("}");
      if (first === -1 || last === -1) throw new Error("No JSON found in response. Try again.");
      var parsed = JSON.parse(raw.slice(first, last + 1));
      if (!parsed.variations || !Array.isArray(parsed.variations)) throw new Error("Unexpected response shape. Try again.");
      state.variations = parsed.variations.map(scrubVariation);
      if (parsed.tmayScript) state.tmay = scrubTmay(parsed.tmayScript);
      if (parsed.prep) state.prep = parsed.prep;
    } catch (e) {
      state.error = (e && e.message) ? e.message : "Something went wrong. Please retry.";
    } finally {
      state.loading = false;
      renderGenerateBtn();
      renderResults();
    }
  }

  /* ============================ INITIAL RENDER ============================ */

  renderJdMeta();
  renderPlatforms();
  renderIndustryBlock();
  renderExperience();
  renderGenerateBtn();
  renderResults();

})();
</script>
</body>
</html>
